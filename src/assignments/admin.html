<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Assignments</title>
    <script src="admin.js" defer></script>
</head>
<body>

    <header>
        <h1>Manage Assignments</h1>
    </header>

    <main>

        <!-- ============================================================
             Section 1: Add / Edit Assignment Form
             ============================================================ -->
        <section>
            <h2>Add a New Assignment</h2>

            <form id="assignment-form" action="#">
                <fieldset>
                    <legend>Assignment Details</legend>

                    <div class="field">
                        <label for="assignment-title">Title</label>
                        <input
                            id="assignment-title"
                            type="text"
                            placeholder="e.g. HTML &amp; CSS Portfolio"
                            required>
                    </div>

                    <div class="field">
                        <label for="assignment-description">Description</label>
                        <textarea
                            id="assignment-description"
                            rows="5"
                            placeholder="Describe what students need to do…"
                            required></textarea>
                    </div>

                    <div class="field">
                        <label for="assignment-due-date">Due Date</label>
                        <input
                            id="assignment-due-date"
                            type="date"
                            required>
                    </div>

                    <div class="field">
                        <label for="assignment-files">Attached File URLs <span style="font-size:0.65rem;color:var(--muted)">(one per line)</span></label>
                        <textarea
                            id="assignment-files"
                            rows="3"
                            placeholder="https://example.com/brief.pdf&#10;https://example.com/assets.zip"></textarea>
                    </div>

                    <button id="add-assignment" type="submit">Add Assignment</button>
                </fieldset>
            </form>
        </section>


        <!-- ============================================================
             Section 2: Existing Assignments Table
             ============================================================ -->
        <section>
            <h2>Current Assignments</h2>

            <div class="table-wrap">
                <table id="assignments-table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Due Date</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="assignments-tbody">
                        <!-- admin.js injects rows here -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>
</body>
</html>
